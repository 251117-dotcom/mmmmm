<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네버랜드 : 동심 되찾기 지도</title>
  <style>
    /* 기본 레이아웃 설정 */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "Noto Sans KR", Arial, sans-serif;
      color: #222;
      background-color: #f8fafc;
    }
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    /* 왼쪽 사이드바 */
    .sidebar {
      width: 380px;
      min-width: 320px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e2e8f0;
      background: #ffffff;
      box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
      z-index: 10;
    }
    .title {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
    }
    .description {
      margin: 0 0 16px;
      color: #64748b;
      font-size: 13px;
    }

    /* 탭 버튼 스타일 */
    .tab-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-button {
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tab-button:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .tab-button.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    /* 마커 카테고리 범례 안내 */
    .legend-bar {
      display: flex;
      justify-content: space-around;
      padding: 8px;
      background: #f1f5f9;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 11px;
      color: #475569;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* 검색 폼 스타일 */
    .search-form {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    #keyword {
      flex: 1;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
    }
    #searchButton {
      padding: 0 14px;
      border: none;
      border-radius: 6px;
      background: #fee500;
      font-weight: bold;
      color: #191919;
      cursor: pointer;
    }
    #searchButton:hover {
      background: #f4dc00;
    }

    /* 상태 문구 표시 영역 */
    #status {
      margin: 6px 0 10px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.4;
    }

    /* 검색 결과 리스트 */
    #resultList {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid #e2e8f0;
    }
    .result-item {
      padding: 12px 6px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .result-item:hover {
      background: #f8fafc;
    }
    .place-name {
      font-size: 14px;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .place-category {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .place-address {
      font-size: 12px;
      color: #334155;
      line-height: 1.3;
    }
    .place-phone {
      font-size: 11px;
      color: #0284c7;
      margin-top: 4px;
    }
    .place-link {
      display: inline-block;
      margin-top: 6px;
      color: #2563eb;
      font-size: 12px;
      text-decoration: none;
    }
    .place-link:hover {
      text-decoration: underline;
    }

    /* 오른쪽 지도 영역 */
    #map {
      flex: 1;
      height: 100%;
      background: #f1f5f9;
    }

    /* 모바일 반응형 처리 */
    @media (max-width: 640px) {
      .container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: 50vh;
      }
      #map {
        height: 50vh;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 왼쪽 검색 패널 -->
    <aside class="sidebar">
      <h1 class="title">🎡 네버랜드 지도</h1>
      <p class="description">동심을 찾아 떠나는 테마파크 탐색 서비스</p>

      <!-- 탭 메뉴 영역 -->
      <div class="tab-group" role="tablist">
        <button
          type="button"
          class="tab-button active"
          id="tabAmusement"
          onclick="selectTab('amusement')"
        >
          <span>🎠 피터팬의 놀이공원</span>
        </button>
        <button
          type="button"
          class="tab-button"
          id="tabWaterpark"
          onclick="selectTab('waterpark')"
        >
          <span>🌊 후크선장과 인어공주의 워터파크</span>
        </button>
        <button
          type="button"
          class="tab-button"
          id="tabEtc"
          onclick="selectTab('etc')"
        >
          <span>🎈 기타 테마파크 (키즈카페 등)</span>
        </button>
      </div>

      <!-- 카테고리 색상 범례 -->
      <div class="legend-bar">
        <div class="legend-item">
          <span class="legend-color" style="background: #ef4444;"></span>
          <span>놀이공원</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #3b82f6;"></span>
          <span>워터파크</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #eab308;"></span>
          <span>키즈카페</span>
        </div>
      </div>

      <!-- 사용자 키워드 직검색 폼 -->
      <form class="search-form" id="searchForm">
        <input
          type="text"
          id="keyword"
          placeholder="직접 장소 검색하기..."
          autocomplete="off"
        >
        <button type="submit" id="searchButton">검색</button>
      </form>

      <p id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다...
      </p>

      <!-- 검색 결과 목록 -->
      <div id="resultList"></div>
    </aside>

    <!-- 오른쪽 지도 영역 -->
    <main id="map" aria-label="네버랜드 장소 지도"></main>
  </div>

  <!-- 카카오 지도 SDK -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a37189a9faf51c8c9c2b9678257633c4&libraries=services&autoload=false"
    onerror="showSdkError()"
  ></script>

  <script>
    // 카카오 지도 관련 상태 변수
    let map;
    let placesService;
    let infoWindow;
    let markers = [];
    let currentLocationMarker = null;
    let currentPosition = null;
    let mapReady = false;
    let activeTab = "amusement";

    // DOM 요소
    const mapElement = document.getElementById("map");
    const searchForm = document.getElementById("searchForm");
    const keywordInput = document.getElementById("keyword");
    const statusElement = document.getElementById("status");
    const resultList = document.getElementById("resultList");

    // 카테고리별 마커 색상 상수
    const COLOR_AMUSEMENT = "#ef4444"; // 빨간색 (놀이공원/테마파크)
    const COLOR_WATERPARK = "#3b82f6"; // 파란색 (워터파크)
    const COLOR_KIDS = "#eab308";      // 노란색 (키즈카페)
    const COLOR_ETC = "#8b5cf6";       // 보라색 (기타)

    // 안내 상태 메시지 설정
    function setStatus(message) {
      statusElement.textContent = message;
    }

    // SDK 로드 실패 핸들러
    function showSdkError() {
      setStatus("지도 SDK를 불러오지 못했습니다. 키 설정과 네트워크를 확인해 주세요.");
    }

    // SVG 데이터를 이용한 커스텀 컬러 마커 이미지 생성
    function createColorMarkerImage(color) {
      const svgMarker = `
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="38" viewBox="0 0 30 38">
          <path fill="${color}" stroke="#FFFFFF" stroke-width="2" d="M15 0C6.716 0 0 6.716 0 15c0 11.25 15 23 15 23s15-11.75 15-23C30 6.716 23.284 0 15 0z"/>
          <circle cx="15" cy="15" r="5.5" fill="#FFFFFF"/>
        </svg>`;
      const markerImageUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgMarker);
      return new kakao.maps.MarkerImage(
        markerImageUrl,
        new kakao.maps.Size(30, 38),
        { offset: new kakao.maps.Point(15, 38) }
      );
    }

    // 현재 위치 전용 마커 이미지 생성
    function createCurrentLocationImage() {
      const svgMarker = `
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="#10b981" stroke="#FFFFFF" stroke-width="3"/>
          <circle cx="12" cy="12" r="4" fill="#FFFFFF"/>
        </svg>`;
      const imageUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgMarker);
      return new kakao.maps.MarkerImage(
        imageUrl,
        new kakao.maps.Size(24, 24),
        { offset: new kakao.maps.Point(12, 12) }
      );
    }

    // 지도 초기화
    function initializeMap() {
      if (!window.kakao || !kakao.maps) {
        showSdkError();
        return;
      }
      try {
        const initialPosition = new kakao.maps.LatLng(37.5665, 126.9780); // 서울시청 기본
        map = new kakao.maps.Map(mapElement, {
          center: initialPosition,
          level: 5
        });

        placesService = new kakao.maps.services.Places(map);
        infoWindow = new kakao.maps.InfoWindow({ zIndex: 2 });

        kakao.maps.event.addListener(map, "tilesloaded", function () {
          if (mapReady) return;
          mapReady = true;
          setStatus("현재 위치를 확인하고 있습니다...");
          requestCurrentPosition();
        });
      } catch (error) {
        console.error("지도 초기화 오류:", error);
        setStatus("지도 초기화 실패. JavaScript 키 및 웹 도메인 설정을 확인해 주세요.");
      }
    }

    // 사용자의 현재 위치 요청
    function requestCurrentPosition() {
      if (!navigator.geolocation) {
        setStatus("현재 위치 기능을 지원하지 않는 브라우저입니다.");
        loadTabPlaces(activeTab);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          currentPosition = new kakao.maps.LatLng(latitude, longitude);

          map.setCenter(currentPosition);
          map.setLevel(6);

          // 현재 위치 마커 생성
          if (currentLocationMarker) {
            currentLocationMarker.setMap(null);
          }
          currentLocationMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: "내 현재 위치",
            image: createCurrentLocationImage()
          });

          setStatus("내 현재 위치를 확인했습니다. 주변 검색을 진행합니다.");
          loadTabPlaces(activeTab);
        },
        function (error) {
          console.warn("위치 확인 실패:", error);
          setStatus("위치를 확인할 수 없어 기본 위치(서울) 기준으로 검색합니다.");
          loadTabPlaces(activeTab);
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
      );
    }

    // 기존 마커와 결과 초기화
    function clearMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });
      markers = [];
      if (infoWindow) {
        infoWindow.close();
      }
    }

    // HTML 특수문자 이스케이프
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };
        return entities[char];
      });
    }

    // 장소 카테고리에 맞는 마커 색상 판별
    function getCategoryColor(place) {
      const category = place.category_name || "";
      const name = place.place_name || "";

      if (category.includes("워터파크") || name.includes("워터파크") || name.includes("스파")) {
        return COLOR_WATERPARK;
      } else if (category.includes("키즈") || name.includes("키즈") || name.includes("베이비")) {
        return COLOR_KIDS;
      } else if (category.includes("놀이공원") || category.includes("테마파크") || name.includes("랜드") || name.includes("월드")) {
        return COLOR_AMUSEMENT;
      }
      return COLOR_ETC;
    }

    // 탭 선택 기능
    function selectTab(tabType) {
      activeTab = tabType;

      // 탭 버튼 활성화 CSS 변경
      document.getElementById("tabAmusement").classList.toggle("active", tabType === "amusement");
      document.getElementById("tabWaterpark").classList.toggle("active", tabType === "waterpark");
      document.getElementById("tabEtc").classList.toggle("active", tabType === "etc");

      loadTabPlaces(tabType);
    }

    // 탭 종류별 검색 키워드 실행
    function loadTabPlaces(tabType) {
      if (tabType === "amusement") {
        searchPlacesByKeyword("놀이공원");
      } else if (tabType === "waterpark") {
        searchPlacesByKeyword("워터파크");
      } else if (tabType === "etc") {
        searchEtcPlaces();
      }
    }

    // 탭 3: 놀이공원, 워터파크를 제외한 기타 테마파크 및 키즈카페 검색
    function searchEtcPlaces() {
      if (!mapReady || !placesService) return;

      setStatus("기타 테마파크 및 키즈카페를 검색하고 있습니다...");
      resultList.replaceChildren();
      clearMarkers();

      const searchOptions = currentPosition
        ? { location: currentPosition, radius: 20000, sort: kakao.maps.services.SortBy.DISTANCE }
        : {};

      // 키즈카페 검색 후 조건에 맞는 장소 표시
      placesService.keywordSearch("키즈카페", function (data, status) {
        if (status === kakao.maps.services.Status.OK) {
          // 놀이공원이나 워터파크로 명확히 분류되지 않은 곳 필터링
          const filteredPlaces = data.filter(function (place) {
            const category = place.category_name || "";
            return !category.includes("놀이공원") && !category.includes("워터파크");
          });

          displayPlaces(filteredPlaces);
          setStatus("기타 테마파크/키즈카페 검색 결과 " + filteredPlaces.length + "개");
        } else {
          setStatus("검색 결과가 없습니다.");
        }
      }, searchOptions);
    }

    // 일반 키워드 검색 처리
    function searchPlacesByKeyword(keyword) {
      if (!mapReady || !placesService) {
        setStatus("지도가 준비될 때까지 잠시 기다려 주세요.");
        return;
      }

      setStatus(`'${keyword}' 장소를 검색 중입니다...`);
      resultList.replaceChildren();
      clearMarkers();

      const searchOptions = currentPosition
        ? { location: currentPosition, radius: 20000, sort: kakao.maps.services.SortBy.DISTANCE }
        : {};

      placesService.keywordSearch(keyword, function (data, status) {
        if (status === kakao.maps.services.Status.OK) {
          displayPlaces(data);
          setStatus(`검색 결과 ${data.length}개`);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
          setStatus("주변에 해당 조건의 장소가 없습니다.");
        } else {
          setStatus("검색 중 오류가 발생했습니다.");
        }
      }, searchOptions);
    }

    // 검색 결과 목록 및 마커 표시
    function displayPlaces(places) {
      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place, index) {
        const position = new kakao.maps.LatLng(Number(place.y), Number(place.x));
        const markerColor = getCategoryColor(place);
        const markerImage = createColorMarkerImage(markerColor);

        // 카카오 지도 마커 생성
        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name,
          image: markerImage
        });

        markers.push(marker);
        bounds.extend(position);

        // UI 결과 목록 생성
        const item = document.createElement("article");
        item.className = "result-item";
        item.tabIndex = 0;
        item.innerHTML = `
          <div class="place-name">${index + 1}. ${escapeHtml(place.place_name)}</div>
          <div class="place-category">${escapeHtml(place.category_name || "테마파크")}</div>
          <div class="place-address">${escapeHtml(place.road_address_name || place.address_name)}</div>
          <div class="place-phone">📞 ${escapeHtml(place.phone || "전화번호 정보 없음")}</div>
          <a class="place-link" href="${escapeHtml(place.place_url)}" target="_blank" rel="noopener noreferrer">
            카카오맵 상세 및 영업시간 보기 ↗
          </a>
        `;

        // 마커 클릭 시 정보 팝업(InfoWindow) 표시 함수
        function showInfoWindow() {
          map.panTo(position);

          const popupContent = `
            <div style="padding:12px; width:220px; font-size:12px; line-height:1.5;">
              <strong style="font-size:14px; color:#1e293b; display:block; margin-bottom:4px;">
                ${escapeHtml(place.place_name)}
              </strong>
              <div style="color:#475569; margin-bottom:4px;">
                📍 ${escapeHtml(place.road_address_name || place.address_name)}
              </div>
              <div style="color:#0284c7; margin-bottom:4px;">
                📞 ${escapeHtml(place.phone || "전화번호 미등록")}
              </div>
              <div style="color:#16a34a; margin-bottom:6px;">
                ⏰ 영업시간: 카카오맵 상세참조
              </div>
              <a href="${escapeHtml(place.place_url)}" target="_blank" style="color:#2563eb; text-decoration:underline;">
                상세 정보 보기
              </a>
            </div>
          `;

          infoWindow.setContent(popupContent);
          infoWindow.open(map, marker);
        }

        // 마커 및 리스트 항목 클릭 이벤트 바인딩
        item.addEventListener("click", function (event) {
          if (event.target.closest("a")) return;
          showInfoWindow();
        });

        kakao.maps.event.addListener(marker, "click", function () {
          showInfoWindow();
        });

        resultList.appendChild(item);
      });

      // 마커 위치들을 포함하도록 지도 영역 자동 조절
      if (places.length > 0) {
        map.setBounds(bounds);
      }
    }

    // 직접 검색 Submit 핸들러
    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();
      const query = keywordInput.value.trim();
      if (!query) {
        setStatus("검색할 키워드를 입력해 주세요.");
        keywordInput.focus();
        return;
      }
      searchPlacesByKeyword(query);
    });

    // SDK 로드 후 지도 실행
    if (window.kakao && window.kakao.maps) {
      kakao.maps.load(initializeMap);
    } else {
      showSdkError();
    }
  </script>
</body>
</html>
