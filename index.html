<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네버랜드: 동심 되찾기 지도</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 360px;
      min-width: 280px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e5e5e5;
      background: #fff;
    }

    .title {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.4;
    }

    .description {
      margin: 0 0 18px;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    .tabs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tab-button {
      padding: 12px 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
    }

    .tab-button:hover {
      background: #fffbea;
    }

    .tab-button.active {
      background: #fff2a8;
      border-color: #e4c94c;
      font-weight: bold;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      font-size: 12px;
      color: #555;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    #status {
      margin: 14px 0 8px;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    #resultList {
      flex: 1;
      overflow-y: auto;
    }

    .result-item {
      padding: 13px 4px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover {
      background: #fafafa;
    }

    .place-name {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .place-category {
      font-size: 11px;
      color: #888;
      margin-bottom: 5px;
    }

    .place-address,
    .place-phone {
      font-size: 12px;
      color: #555;
      line-height: 1.5;
    }

    .place-link {
      display: inline-block;
      margin-top: 7px;
      color: #1769aa;
      font-size: 12px;
      text-decoration: none;
    }

    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #f3f3f3;
    }

    @media (max-width: 600px) {
      .sidebar {
        width: 45%;
        min-width: 155px;
        padding: 14px 9px;
      }

      .title { font-size: 17px; }
      .description { font-size: 11px; }
      .tab-button { font-size: 11px; padding: 10px 7px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <aside class="sidebar">
      <h1 class="title">네버랜드: 동심 되찾기 지도</h1>

      <p class="description">
        바쁜 일상에서 벗어나 동심을 되찾아 보세요!<br>
        원하는 테마를 선택해 주변 장소를 찾아보세요.
      </p>

      <div class="tabs">
        <button class="tab-button active" data-tab="amusement">
          🎡 피터팬과 아이들이 사는 놀이공원
        </button>

        <button class="tab-button" data-tab="waterpark">
          🌊 후크 선장과 인어공주가 사는 워터파크
        </button>

        <button class="tab-button" data-tab="other">
          ✨ 기타 테마파크와 키즈카페
        </button>
      </div>

      <div class="legend">
        <span class="legend-item">
          <span class="dot" style="background:#e53935"></span>놀이공원
        </span>
        <span class="legend-item">
          <span class="dot" style="background:#1e88e5"></span>워터파크
        </span>
        <span class="legend-item">
          <span class="dot" style="background:#fdd835"></span>키즈카페
        </span>
      </div>

      <p id="status">지도를 불러오는 중입니다.</p>
      <div id="resultList"></div>
    </aside>

    <main id="map"></main>
  </div>

  <!-- 카카오 지도 SDK를 불러옵니다. -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JAVASCRIPT_KEY&libraries=services&autoload=false"
    onload="loadKakaoMap()"
    onerror="showSdkError()">
  </script>

  <script>
    // 지도와 검색에 필요한 변수를 선언합니다.
    let map;
    let placesService;
    let infoWindow;
    let markers = [];
    let currentLocationMarker = null;
    let currentPosition = null;
    let currentTab = "amusement";
    let searchRunId = 0;

    const statusElement = document.getElementById("status");
    const resultList = document.getElementById("resultList");
    const tabButtons = document.querySelectorAll(".tab-button");

    // 탭별 검색 키워드와 기본 마커 색상을 설정합니다.
    const tabSettings = {
      amusement: {
        keywords: ["놀이공원", "테마파크"],
        color: "#e53935",
        name: "놀이공원"
      },
      waterpark: {
        keywords: ["워터파크"],
        color: "#1e88e5",
        name: "워터파크"
      },
      other: {
        keywords: ["키즈카페", "실내놀이터", "체험형 테마파크", "이색 테마파크"],
        color: "#fdd835",
        name: "기타 테마파크"
      }
    };

    // 안내 문구를 변경합니다.
    function setStatus(message) {
      statusElement.textContent = message;
    }

    // 지도 SDK를 불러오지 못했을 때 안내합니다.
    function showSdkError() {
      setStatus("지도 SDK를 불러오지 못했습니다. JavaScript 키와 웹 도메인을 확인해 주세요.");
    }

    // SDK가 준비되면 지도를 초기화합니다.
    function loadKakaoMap() {
      if (!window.kakao || !window.kakao.maps) {
        showSdkError();
        return;
      }

      kakao.maps.load(initializeMap);
    }

    // 지도를 생성하고 장소 검색 서비스를 준비합니다.
    function initializeMap() {
      try {
        const initialPosition = new kakao.maps.LatLng(37.5665, 126.9780);

        map = new kakao.maps.Map(document.getElementById("map"), {
          center: initialPosition,
          level: 6
        });

        placesService = new kakao.maps.services.Places(map);
        infoWindow = new kakao.maps.InfoWindow({ zIndex: 10 });

        setStatus("현재 위치를 확인하고 있습니다.");
        requestCurrentPosition();
      } catch (error) {
        console.error(error);
        setStatus("지도 초기화에 실패했습니다. JavaScript 키와 웹 도메인을 확인해 주세요.");
      }
    }

    // 현재 위치를 확인하고 지도에 표시합니다.
    function requestCurrentPosition() {
      if (!navigator.geolocation) {
        setStatus("현재 위치를 지원하지 않아 서울 시청을 기준으로 검색합니다.");
        searchCurrentTab();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(currentPosition);
          map.setLevel(6);

          currentLocationMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: "현재 위치",
            zIndex: 100
          });

          setStatus("현재 위치를 찾았습니다. 주변 장소를 검색합니다.");
          searchCurrentTab();
        },
        function () {
          setStatus("현재 위치를 확인하지 못해 서울 시청을 기준으로 검색합니다.");
          searchCurrentTab();
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 이전 검색 결과의 마커와 목록을 제거합니다.
    function clearResults() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers = [];
      resultList.replaceChildren();

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 장소 정보를 HTML에 안전하게 표시하도록 문자를 변환합니다.
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, function (char) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[char];
      });
    }

    // 장소의 종류에 따라 마커 색상을 결정합니다.
    function getPlaceColor(place, tabKey) {
      const text = (place.category_name || "") + " " + (place.place_name || "");

      if (text.includes("워터파크")) return "#1e88e5";
      if (text.includes("키즈카페") || text.includes("실내놀이터")) return "#fdd835";

      return tabSettings[tabKey].color;
    }

    // 지정한 색상의 지도 마커 이미지를 생성합니다.
    function createMarkerImage(color) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="46" viewBox="0 0 36 46">
          <path d="M18 1C8.6 1 1 8.6 1 18c0 12 17 27 17 27s17-15 17-27C35 8.6 27.4 1 18 1z"
                fill="${color}" stroke="#ffffff" stroke-width="2"/>
          <circle cx="18" cy="18" r="6" fill="#ffffff"/>
        </svg>`;

      const imageUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);

      return new kakao.maps.MarkerImage(
        imageUrl,
        new kakao.maps.Size(36, 46),
        { offset: new kakao.maps.Point(18, 46) }
      );
    }

    // 선택한 탭에 해당하는 주변 장소를 검색합니다.
    function searchCurrentTab() {
      if (!placesService || !map) {
        setStatus("지도가 준비될 때까지 기다려 주세요.");
        return;
      }

      const runId = ++searchRunId;
      const settings = tabSettings[currentTab];
      const allPlaces = [];
      let completed = 0;

      clearResults();
      setStatus(settings.name + " 주변 장소를 검색하고 있습니다.");

      settings.keywords.forEach(function (keyword) {
        const options = currentPosition
          ? {
              location: currentPosition,
              radius: 20000,
              sort: kakao.maps.services.SortBy.DISTANCE
            }
          : {};

        placesService.keywordSearch(keyword, function (data, status) {
          // 탭을 바꾼 뒤 도착한 이전 검색 결과는 표시하지 않습니다.
          if (runId !== searchRunId) return;

          if (status === kakao.maps.services.Status.OK) {
            data.forEach(function (place) {
              // 중복 장소는 한 번만 추가합니다.
              if (!allPlaces.some(function (saved) {
                return saved.id === place.id;
              })) {
                allPlaces.push(place);
              }
            });
          }

          completed++;

          if (completed === settings.keywords.length) {
            displayPlaces(allPlaces, currentTab, runId);
          }
        }, options);
      });
    }

    // 검색 결과를 왼쪽 목록과 지도 마커로 표시합니다.
    function displayPlaces(places, tabKey, runId) {
      if (runId !== searchRunId) return;

      if (places.length === 0) {
        setStatus("검색 결과가 없습니다. 다른 탭을 선택해 보세요.");
        return;
      }

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place, index) {
        const position = new kakao.maps.LatLng(Number(place.y), Number(place.x));
        const color = getPlaceColor(place, tabKey);

        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name,
          image: createMarkerImage(color)
        });

        markers.push(marker);
        bounds.extend(position);

        // 왼쪽 장소 목록 항목을 만듭니다.
        const item = document.createElement("article");
        item.className = "result-item";
        item.tabIndex = 0;
        item.setAttribute("role", "button");

        item.innerHTML = `
          <div class="place-name">${index + 1}. ${escapeHtml(place.place_name)}</div>
          <div class="place-category">${escapeHtml(place.category_name || "분류 정보 없음")}</div>
          <div class="place-address">${escapeHtml(place.road_address_name || place.address_name || "주소 정보 없음")}</div>
          <div class="place-phone">${escapeHtml(place.phone || "전화번호 정보 없음")}</div>
          <a class="place-link"
             href="${escapeHtml(place.place_url || "https://map.kakao.com/")}"
             target="_blank" rel="noopener noreferrer">카카오맵에서 보기 ↗</a>
        `;

        // 장소를 선택하면 지도 이동과 상세 정보 팝업을 실행합니다.
        function selectPlace() {
          map.panTo(position);

          const address = place.road_address_name || place.address_name || "주소 정보 없음";
          const phone = place.phone || "전화번호 정보 없음";
          const detailUrl = place.place_url || "https://map.kakao.com/";

          infoWindow.setContent(`
            <div style="padding:12px;max-width:250px;font-size:12px;line-height:1.6;">
              <strong style="font-size:14px;">${escapeHtml(place.place_name)}</strong><br>
              ${escapeHtml(address)}<br>
              전화번호: ${escapeHtml(phone)}<br>
              영업시간: 카카오맵에서 확인해 주세요.<br>
              <a href="${escapeHtml(detailUrl)}" target="_blank" rel="noopener noreferrer">
                상세 정보 보기
              </a>
            </div>
          `);

          infoWindow.open(map, marker);
        }

        // 목록을 클릭하면 해당 장소를 선택합니다.
        item.addEventListener("click", function (event) {
          if (event.target.closest("a")) return;
          selectPlace();
        });

        // 키보드로도 장소를 선택할 수 있도록 합니다.
        item.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectPlace();
          }
        });

        // 지도 마커를 클릭해도 장소 정보가 표시됩니다.
        kakao.maps.event.addListener(marker, "click", selectPlace);

        resultList.appendChild(item);
      });

      setStatus("검색 결과 " + places.length + "곳을 찾았습니다.");

      // 검색 결과가 모두 보이도록 지도 범위를 조절합니다.
      if (currentPosition) {
        bounds.extend(currentPosition);
      }

      map.setBounds(bounds);
    }

    // 탭을 클릭하면 기존 결과를 지우고 새 탭의 장소를 검색합니다.
    tabButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        tabButtons.forEach(function (tab) {
          tab.classList.remove("active");
        });

        button.classList.add("active");
        currentTab = button.dataset.tab;
        searchCurrentTab();
      });
    });
  </script>
</body>
</html>
